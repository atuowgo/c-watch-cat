# watch-cat 配置文件
# 所有阈值都有合理默认值, 先跑起来, 再根据 events/ 里保存的误报片段微调。

camera:
  source: 0          # 摄像头索引; 也可以填 RTSP 地址 "rtsp://..." 或视频文件路径
  width: 1280
  height: 720

detection:
  model: yolov8n.pt  # 首次运行自动下载 (~6MB); 树莓派等弱设备也能跑
  confidence: 0.4
  imgsz: 640         # 弱设备可降到 480 / 320 提速
  interval: 5        # 每 5 帧跑一次 YOLO, 其余帧沿用上次结果
  miss_timeout: 1.5  # 连续 1.5 秒没检测到猫, 视为猫离开画面

behavior:
  stationary_window: 2.5        # 身体静止需持续的秒数
  stationary_tolerance: 0.30    # 中心位移 < 0.3*框宽 视为静止
  scratch_motion_threshold: 4.0 # 框内运动量阈值 (误报多就调高, 漏报就调低)
  scratch_min_seconds: 1.5      # 扒地持续 1.5 秒才确认
  squat_ratio_drop: 0.75        # 高宽比降到正常姿态的 75% 以下算蹲姿
  squat_min_seconds: 1.0
  trigger_on: scratch  # scratch: 扒地就报 (最早介入, 推荐)
                       # squat:   蹲下才报
                       # both:    先扒地后蹲下才报 (误报最少但介入最晚)

alert:
  sound: sounds/alert.wav  # 强烈建议换成你自己吼猫的录音!
  cooldown: 45             # 两次警报之间至少间隔 45 秒
  repeat: 2                # 每次触发连播 2 遍

zones:
  litter_box: []  # 猫砂盆区域, 用 python tools/calibrate_zone.py 画出来
  ignore: []      # 忽略区域 (食盆附近猫会做"埋食物"动作, 容易误报)

recording:
  enabled: true
  dir: events      # 每次触发保存 snapshot.jpg + clip.mp4 (事件前8秒+后5秒)
  pre_seconds: 8
  post_seconds: 5
