# watch-cat 配置文件 (旧手机组网版)
#
# 每台旧手机 = 摄像头 (IP Webcam 推流) + 音箱 (Termux 放声服务)。
# 一期只配一台; 二期猫换房间作案后, 加一台手机就是加一个条目。
# 手机端安装步骤见 README「手机节点安装」一节。

cameras:
  # ---- 一期: 案发高发区的第一台手机 ----
  - name: living_room                          # 房间名, 也是 events/ 下的子目录名
    source: "http://192.168.1.101:8080/video"  # IP Webcam 的视频流地址 (改成你的手机 IP)
    alert_url: "http://192.168.1.101:8765/play" # 同一台手机上的放声服务; 留空则主机放声
    zones:
      litter_box: []  # 用 python tools/calibrate_zone.py --camera living_room 画
      ignore: []      # 食盆附近建议画进来, 猫"埋食物"的动作和扒地一样, 会误报
    # behavior:       # 可按路覆盖全局阈值: 老手机画质噪点大导致误报时,
    #   scratch_motion_threshold: 6.0   # 单独调高这一路的运动量阈值

  # ---- 二期: 猫转移阵地后, 逐个房间加手机 (去掉注释即可) ----
  # - name: bedroom
  #   source: "http://192.168.1.102:8080/video"
  #   alert_url: "http://192.168.1.102:8765/play"
  #   zones:
  #     litter_box: []
  #     ignore: []

  # 调试: 不用手机, 直接用电脑摄像头
  # - name: debug
  #   source: 0

detection:
  model: yolov8n.pt  # 首次运行自动下载 (~6MB)
  confidence: 0.4
  imgsz: 640         # 主机性能弱可降到 480 / 320
  interval: 5        # 每 5 帧跑一次 YOLO; 摄像头多了可调大 (8-10)
  miss_timeout: 1.5  # 连续 1.5 秒没检测到猫, 视为猫离开画面

behavior:
  stationary_window: 2.5        # 身体静止需持续的秒数
  stationary_tolerance: 0.30    # 中心位移 < 0.3*框宽 视为静止
  scratch_motion_threshold: 4.0 # 框内运动量阈值 (误报多就调高, 漏报就调低)
  scratch_min_seconds: 1.5      # 扒地持续 1.5 秒才确认
  squat_ratio_drop: 0.75        # 高宽比降到正常姿态的 75% 以下算蹲姿
  squat_min_seconds: 1.0
  trigger_on: scratch  # scratch: 扒地就报 (最早介入, 推荐)
                       # squat:   蹲下才报
                       # both:    先扒地后蹲下才报 (误报最少但介入最晚)

alert:
  enabled: false           # 上线第一周建议保持影子模式: 只记录事件不出声,
                           # 回看 events/ 确认没有误报后再改成 true 放开吼声
  sound: sounds/alert.wav  # 主机兜底用 (手机放声服务不可达时); 建议也换成吼声录音
  cooldown: 45             # 全局冷却: 猫跨房间不会被连吼两次
  repeat: 2                # 每次触发连播 2 遍

recording:
  enabled: true
  dir: events      # 每路摄像头保存到 events/<房间名>/<时间戳>/
  pre_seconds: 8
  post_seconds: 5
